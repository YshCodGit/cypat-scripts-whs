name: Enforce File Ownership

on:
  pull_request:
    branches: [ main ]

jobs:
  check-ownership:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Essential to fetch full history for tracking file authors

      - name: Verify modified files creator
        run: |
          git fetch origin main:main
          
          # Get list of modified (M) or deleted (D) files in this PR
          CHANGED_FILES=$(git diff --name-only main...HEAD)
          PR_AUTHOR_EMAIL="${{ github.event.pull_request.user.login }}@://github.com"
          
          # Try to get the actual Git commit email if available
          GIT_AUTHOR_EMAIL=$(git log -1 --pretty=format:'%ae')
          
          VIOLATIONS=0
          
          for file in $CHANGED_FILES; do
            # Ignore files that don't exist in the main branch (i.e., brand new files)
            if ! git cat-file -e "main:$file" 2>/dev/null; then
              echo "✅ $file is a new file. Allowed."
              continue
            fi
            
            # Find the original creator's email (the very first commit of this file)
            ORIGINAL_CREATOR_EMAIL=$(git log --follow --format='%ae' "$file" | tail -n 1)
            ORIGINAL_CREATOR_NAME=$(git log --follow --format='%an' "$file" | tail -n 1)
            
            echo "Checking modified file: $file"
            echo "-> Original Creator Email: $ORIGINAL_CREATOR_EMAIL"
            echo "-> PR Submitter (GitHub): $PR_AUTHOR_EMAIL"
            echo "-> Committer Email: $GIT_AUTHOR_EMAIL"
            
            # Verify if the person modifying it is the original creator
            if [ "$GIT_AUTHOR_EMAIL" != "$ORIGINAL_CREATOR_EMAIL" ] && [ "$PR_AUTHOR_EMAIL" != "$ORIGINAL_CREATOR_EMAIL" ]; then
              echo "❌ ERROR: You cannot modify '$file'. It was originally created by $ORIGINAL_CREATOR_NAME ($ORIGINAL_CREATOR_EMAIL)."
              VIOLATIONS=$((VIOLATIONS+1))
            else
              echo "✅ Match found. You are the original creator of $file."
            fi
          done
          
          if [ $VIOLATIONS -gt 0 ]; then
            echo "Submission rejected. You can only modify files you originally created."
            exit 1
          fi
