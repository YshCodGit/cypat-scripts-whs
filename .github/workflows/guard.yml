name: CyPat Strict Script Guard

on:
  pull_request:
    branches: [ main ]

jobs:
  verify-and-merge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enforce Folder and Ownership Rules
        id: rule_check
        run: |
          git fetch origin main:main
          
          # Get list of modified, added, or deleted files in this PR
          CHANGED_FILES=$(git diff --name-only main...HEAD)
          PR_AUTHOR_EMAIL="${{ github.event.pull_request.user.login }}@://github.com"
          GIT_AUTHOR_EMAIL=$(git log -1 --pretty=format:'%ae')
          
          VIOLATIONS=0
          
          for file in $CHANGED_FILES; do
            echo "Analyzing path: $file"
            
            # --- RULE 1: FOLDER RESTRICTION ---
            # Check if the file sits outside the authorized CyPat directories
            if [[ ! "$file" =~ ^(cisco/|mint/|windows/|ubuntu/|linux/) ]]; then
              echo "❌ ERROR: You cannot modify '$file'. Submissions are strictly limited to cisco/, mint/, windows/, ubuntu/, and linux/ folders."
              VIOLATIONS=$((VIOLATIONS+1))
              continue
            fi
            
            # --- RULE 2: OWNERSHIP RESTRICTION ---
            # Ignore brand new files (Anyone can create a new script inside the safe folders)
            if ! git cat-file -e "main:$file" 2>/dev/null; then
              echo "✅ '$file' is a brand new script. Allowed."
              continue
            fi
            
            # Find the original creator of the file to protect it
            ORIGINAL_CREATOR_EMAIL=$(git log --follow --format='%ae' "$file" | tail -n 1)
            ORIGINAL_CREATOR_NAME=$(git log --follow --format='%an' "$file" | tail -n 1)
            
            if [ "$GIT_AUTHOR_EMAIL" != "$ORIGINAL_CREATOR_EMAIL" ] && [ "$PR_AUTHOR_EMAIL" != "$ORIGINAL_CREATOR_EMAIL" ]; then
              echo "❌ ERROR: You cannot edit '$file'. It belongs to $ORIGINAL_CREATOR_NAME."
              VIOLATIONS=$((VIOLATIONS+1))
            else
              echo "✅ Ownership match found. You are allowed to edit '$file'."
            fi
          done
          
          if [ $VIOLATIONS -gt 0 ]; then
            echo "Submission rejected due to rule violations."
            exit 1
          fi

      - name: Automatically Merge into Main
        if: success()
        uses: pascalgn/automerge-action@v0.16.4
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          MERGE_METHOD: "squash"
          MERGE_LABELS: "" 
