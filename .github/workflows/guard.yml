name: CyPat Strict Script Guard

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: write
  pull-requests: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enforce Folder and Ownership Rules
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPO: ${{ github.repository }}
        run: |
          VIOLATIONS=0

          while IFS= read -r file; do
            echo "Analyzing: $file"

            if [[ ! "$file" =~ ^(cisco|mint|windows|ubuntu|linux)/ ]]; then
              echo "::error::Cannot modify '$file'. Only cisco/, mint/, windows/, ubuntu/, linux/ allowed."
              VIOLATIONS=$((VIOLATIONS+1))
              continue
            fi

            if ! git cat-file -e "$BASE_SHA:$file" 2>/dev/null; then
              echo "New file: $file"
              continue
            fi

            FIRST_SHA=$(git log "$BASE_SHA" --follow --format='%H' -- "$file" | tail -n 1)
            OWNER=$(gh api "repos/$REPO/commits/$FIRST_SHA" --jq '.author.login')

            if [ "$OWNER" != "$PR_AUTHOR" ]; then
              echo "::error::Cannot edit '$file'. It belongs to $OWNER."
              VIOLATIONS=$((VIOLATIONS+1))
            else
              echo "Ownership match: $file"
            fi
          done < <(git diff --name-only --no-renames "$BASE_SHA...$HEAD_SHA")

          if [ "$VIOLATIONS" -gt 0 ]; then
            echo "Submission rejected."
            exit 1
          fi

  merge:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: pascalgn/automerge-action@v0.16.4
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          MERGE_METHOD: "squash"
          MERGE_LABELS: ""
